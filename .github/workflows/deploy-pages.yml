name: Deploy GitHub Pages

on:
  push:
    branches:
      - finalization/sprint2-integration
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full provenance/model validators consume archived raw assets that are
      # intentionally excluded from Git. This job verifies the tracked,
      # publishable tree that a clean GitHub runner can reproduce.
      - name: Verify publishable source tree
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test:unit
          pnpm test:integration
          pnpm validate:archive-media

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build project site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Add GitHub Pages support files
        run: |
          test -f dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
