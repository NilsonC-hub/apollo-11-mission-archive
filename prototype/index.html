<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Non-production Apollo 11 Archive and Mission Control visual direction prototype"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23151819'/%3E%3Ctext x='5' y='21' fill='%23e7e1d4' font-family='monospace' font-size='12'%3EA11%3C/text%3E%3C/svg%3E"
    />
    <title>Apollo 11 — Visual Direction Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="prototype-ribbon" role="note">
      <span>VISUAL DIRECTION PROTOTYPE</span>
      <strong>NON-PRODUCTION · PHASE 0 AUDIT CHAIN UNCHANGED</strong>
    </div>
    <header class="global-header">
      <a
        class="wordmark"
        href="#archive"
        data-mode-link="archive"
        aria-label="Apollo 11 Mission Archive home"
      >
        <span class="wordmark-mark" aria-hidden="true">A11</span>
        <span><b>APOLLO 11</b><small>MISSION ARCHIVE</small></span>
      </a>
      <nav class="mode-nav" aria-label="Primary modes">
        <a href="#archive" data-mode-link="archive"><span>01</span> MISSION ARCHIVE</a>
        <a href="#control" data-mode-link="control"><span>02</span> HISTORICAL REPLAY</a>
      </nav>
      <button class="header-tool" type="button" data-open-source="NASA-A11-MR">
        SOURCES / METHOD
      </button>
    </header>

    <main id="main" tabindex="-1"></main>

    <dialog id="source-dialog" class="source-dialog" aria-labelledby="source-dialog-title">
      <form method="dialog" class="dialog-head">
        <p>PROVENANCE RECORD</p>
        <button value="close" aria-label="Close source record">CLOSE ×</button>
      </form>
      <div id="source-dialog-content"></div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
